<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lida AI 🍂</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="leaves" aria-hidden="true">
    <span>🍂</span><span>🍁</span><span>🍂</span><span>🍁</span><span>🍂</span>
  </div>
  <div class="app">
    <header>
      <div>
        <div class="logo">L<span>i</span>da AI</div>
        <div class="subtitle">a little autumn AI corner 🍂</div>
      </div>
      <div class="online"><i></i> online</div>
    </header>

    <main id="chat">
      <section class="welcome">
        <div class="big-logo">L</div>
        <div class="season">AUTUMN MODE</div>
        <h1>Hey, ik ben <b>Lida AI</b> 🍁</h1>
        <p>Een gezellige plek om vragen te stellen, ideeën te krijgen en samen dingen te ontdekken.</p>
      </section>
    </main>

    <div class="suggestions">
      <button data-text="Help me met mijn huiswerk 📚">📚 Huiswerk</button>
      <button data-text="Geef me een creatief idee ✨">✨ Idee</button>
      <button data-text="Vertel me een leuke grap 😂">😂 Grap</button>
      <button data-text="Geef me een leuke herfstactiviteit 🍂">🍂 Herfst</button>
    </div>

    <form id="form">
      <input id="input" placeholder="Praat met Lida AI..." autocomplete="off" maxlength="8000">
      <button id="send" aria-label="Verstuur">➤</button>
    </form>
    <div class="footer">Lida AI • autumn edition 🍂</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
